<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Запись на зачёты</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#19263b;--line:#2a3a52;--text:#edf3fb;--muted:#9eafc5;--accent:#70a7ff;--green:#42c98a;--red:#ff7474;--yellow:#f4c66a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101b2d,#09111e 60%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
header{padding:22px 16px 14px;max-width:1050px;margin:auto}h1{font-size:26px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}
p{margin:6px 0;color:var(--muted)}button,input,select{font:inherit}button{border:1px solid var(--line);background:#22334d;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#2864b5;border-color:#397bd4}button.good{background:#155d48;border-color:#26866a}button.danger{background:#632f3a;border-color:#944653}button.small{padding:6px 9px;font-size:13px}
main{max-width:1050px;margin:auto;padding:0 16px 50px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.status{padding:11px 13px;border:1px solid var(--line);background:#111c2d;border-radius:12px;color:var(--muted);margin:10px 0}.error{color:#ffd1d1;border-color:#84434a;background:#301c27}.success{color:#c8ffe6;border-color:#286c58;background:#12352e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.card{background:rgba(19,30,48,.96);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 28px #0002}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.date{font-size:13px;color:#b7c8dd;margin-top:5px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:12px;background:#26364d;color:#c7d9ef;white-space:nowrap}.pill.open{background:#174b3c;color:#b9ffe0}.pill.closed{background:#4a2932;color:#ffd0d0}.pill.soon{background:#4a3c20;color:#ffe5a8}
.progress{height:7px;background:#29384d;border-radius:10px;overflow:hidden;margin:12px 0 5px}.progress>i{display:block;height:100%;background:var(--green);width:0}
.groups{display:grid;gap:9px;margin-top:12px}.group{background:#101a2a;border:1px solid #26364b;border-radius:12px;padding:10px}.grouptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#d8e5f5;font-weight:600}.slots{display:grid;grid-template-columns:1fr;gap:7px}.slot{min-width:0;min-height:48px;padding:9px 11px;border-radius:10px;text-align:left;background:#1b2b40;border:1px solid #31445e;font-size:14px;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px}.slot.free{color:#c6d7eb}.slot.taken{background:#174535;border-color:#286c54;color:#caffdf}.slot .num{display:inline-block;flex:0 0 82px;font-size:12px;color:#91a5bd;margin:0}.slot button{font-size:12px;padding:6px 10px;margin:0 0 0 auto;width:auto;flex:none}
.adminbox{border:1px solid #405675;background:#111d2f;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input,.row select,.adminbox input,.adminbox select{background:#0d1726;border:1px solid #354862;color:var(--text);border-radius:9px;padding:9px;min-width:0}.adminbox input{width:100%;margin:5px 0 9px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.empty{text-align:center;padding:30px;color:var(--muted)}.footer{color:#71839b;font-size:12px;text-align:center;padding:25px 10px}
.exam-grid{display:grid;grid-template-columns:1fr;gap:10px}
.exam-tile{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:6px 12px;align-items:center;text-align:left;min-height:82px;padding:14px 15px;background:linear-gradient(145deg,#192940,#121e30);border:1px solid #30445f;border-radius:14px}
.exam-tile:active{transform:scale(.985)}
.tile-title{grid-column:1;grid-row:1;font-size:16px;line-height:1.25;font-weight:700;color:#f0f5fc}
.tile-date{grid-column:1;grid-row:2;font-size:12px;color:#a8bad0}
.tile-bottom{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;margin:0}
.tile-free{font-size:12px;color:#c8d9ec;white-space:nowrap}
.tile-status{font-size:11px;padding:5px 8px;border-radius:20px;background:#26364d;color:#c7d9ef;text-align:center}
.tile-status.open{background:#174b3c;color:#b9ffe0}.tile-status.closed{background:#4a2932;color:#ffd0d0}.tile-status.soon{background:#4a3c20;color:#ffe5a8}
.detail-top{display:flex;align-items:center;gap:10px;margin:2px 0 13px}
.back-btn{flex:none;padding:8px 11px}
.detail-heading{min-width:0;flex:1}
.detail-heading h2{margin:0;font-size:20px}
.booking-box{margin-top:15px;padding:14px;border:1px solid #3976b7;background:#12243a;border-radius:14px;scroll-margin-top:12px}
.booking-box h3{margin-bottom:5px}
.booking-box input{width:100%;margin:10px 0;background:#0d1726;border:1px solid #405a78;color:var(--text);border-radius:10px;padding:12px;font-size:16px}
.booking-box .row button{flex:1}
.slot-pick{height:auto;background:#24496d;border:1px solid #3c6fa0;border-radius:8px;padding:7px 12px;color:#e2f0ff;font-size:12px}
.slot.free:has(.slot-pick){border-color:#3d6b9d;background:#1a3049}
.slot.free:has(.slot-pick) .slot-pick{color:#e5f2ff}
.slot.free:has(.slot-pick):active{background:#244a70}
@media(max-width:430px){.exam-tile{min-height:78px;padding:12px}.tile-title{font-size:15px}.tile-date{font-size:11px}.tile-free{font-size:11px}.tile-status{font-size:10px}.slot{min-height:50px;padding:10px;font-size:14px}.slot .num{flex-basis:76px}.slot button{font-size:11px;padding:7px 9px}}
.detail-note{margin:10px 0 0;color:#9eb2ca;font-size:12px}
@media(max-width:430px){h1{font-size:23px}.card{padding:12px}.exam-grid{gap:8px}}

</style>
</head>
<body>
<header>
  <h1>Запись на зачёты</h1>
  <p>Выберите зачёт, пятёрку и свободное место.</p>
</header>
<main>
  <div class="toolbar">
    <button id="refreshBtn" class="primary">↻ Обновить</button>
    <button id="adminToggle">Администратор</button>
  </div>
  <div id="message" class="status">Подключаемся к базе данных…</div>
  <section id="adminPanel" class="adminbox hidden">
    <h2>Панель администратора</h2>
    <div id="loginBox">
      <p>Войдите под учётной записью администратора.</p>
      <input id="email" type="email" autocomplete="username" placeholder="Электронная почта">
      <input id="password" type="password" autocomplete="current-password" placeholder="Пароль">
      <div class="row"><button id="loginBtn" class="primary">Войти</button></div>
    </div>
    <div id="adminTools" class="hidden">
      <div class="row"><span id="adminIdentity" class="muted"></span><button id="logoutBtn" class="small">Выйти</button><button id="historyBtn" class="small">История действий</button></div>
      <div id="historyBox" class="hidden status"></div>
      <p class="muted">Администраторские действия доступны только после проверки прав в базе.</p>
    </div>
  </section>
  <section id="credits" class="grid" aria-live="polite"></section>
  <div class="footer">Данные обновляются автоматически. Время зачётов указано по Минску.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';
  const SUPABASE_URL = 'https://ebmqoewdzcmpskyiaycu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vRRa5f2VDoUCEvcJ2Qew2g_rym4Fg7J';
  const $ = id => document.getElementById(id);
  const state = { db:null, credits:[], groups:[], slots:[], isAdmin:false, user:null, busy:false, moveFrom:null, selectedCreditId:null, selectedSlot:null };
  const dbReady = () => !!state.db;
  function message(text, type='') { const el=$('message'); el.textContent=text; el.className='status'+(type?' '+type:''); }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dateText(value) {
    const d=new Date(value);
    return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
  }
  function signupState(c) {
    if(c.signup_mode==='open') return ['Открыта','open'];
    if(c.signup_mode==='closed') return ['Закрыта','closed'];
    const now=Date.now(), start=new Date(c.exam_date).getTime();
    if(now<start-24*3600*1000) return ['Откроется за 24 часа','soon'];
    if(now>=start) return ['Зачёт начался · запись закрыта','closed'];
    return ['Открыта автоматически','open'];
  }
  function localKey(id){return 'credit_signup_'+id;}
  function getLocal(id){try{return JSON.parse(localStorage.getItem(localKey(id))||'null')}catch{return null}}
  function saveLocal(id,data){try{localStorage.setItem(localKey(id),JSON.stringify(data))}catch{}}
  function newToken(){
    const bytes=new Uint8Array(32); crypto.getRandomValues(bytes);
    return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function loadData(show=true) {
    if(!dbReady()) return;
    if(show) message('Загружаем зачёты и места…');
    try {
      const results=await Promise.all([
        state.db.from('exam_credits').select('*').order('exam_date'),
        state.db.from('exam_groups').select('*').order('group_number'),
        state.db.from('exam_slots_public').select('*').order('position')
      ]);
      const names=['зачёты','пятёрки','места'];
      for(let i=0;i<results.length;i++) if(results[i].error) throw new Error('Ошибка загрузки ('+names[i]+'): '+results[i].error.message);
      state.credits=results[0].data||[]; state.groups=results[1].data||[]; state.slots=results[2].data||[];
      render();
      message('Загружено: '+state.credits.length+' зачётов · '+state.groups.length+' пятёрок · '+state.slots.length+' мест.','success');
    } catch(e) {
      message('Не удалось загрузить данные: '+e.message+' Обновите страницу или проверьте доступ Supabase.','error');
      $('credits').innerHTML='<div class="empty">Не удалось загрузить таблицу. Текст ошибки указан выше.</div>';
    }
  }
  function render() {
    const root=$('credits');
    if(!state.credits.length){root.innerHTML='<div class="empty">Зачёты пока не найдены.</div>';return;}
    const selected=state.credits.find(c=>c.id===state.selectedCreditId);
    if(!selected){
      state.selectedCreditId=null;
      state.selectedSlot=null;
      root.innerHTML='<div class="exam-grid">'+state.credits.map(c=>{
        const groups=state.groups.filter(g=>g.credit_id===c.id);
        const ids=new Set(groups.map(g=>g.id));
        const slots=state.slots.filter(x=>ids.has(x.group_id));
        const occupied=slots.filter(x=>x.surname).length;
        const [status,cls]=signupState(c);
        return `<button class="exam-tile" data-action="open-credit" data-id="${c.id}">
          <span class="tile-title">${esc(c.subject)}</span>
          <span class="tile-date">${esc(dateText(c.exam_date))}</span>
          <span class="tile-bottom"><span class="tile-free">Свободно ${slots.length-occupied} из ${slots.length}</span><span class="tile-status ${cls}">${esc(status)}</span></span>
        </button>`;
      }).join('')+'</div>';
      return;
    }

    const c=selected;
    const groups=state.groups.filter(g=>g.credit_id===c.id);
    const groupIds=new Set(groups.map(g=>g.id));
    const slots=state.slots.filter(x=>groupIds.has(x.group_id));
    const occupied=slots.filter(x=>x.surname).length;
    const [status,cls]=signupState(c);
    const admin=state.isAdmin;
    let booking='';
    if(state.selectedSlot){
      const chosen=slots.find(x=>x.id===state.selectedSlot.id);
      if(chosen && !chosen.surname && !admin){
        const local=getLocal(c.id);
        booking=`<form id="bookingForm" class="booking-box">
          <h3>Вы выбрали: пятёрка ${esc(state.selectedSlot.groupNumber)}, место ${chosen.position}</h3>
          <p>Введите фамилию и подтвердите запись.</p>
          <input id="bookingSurname" maxlength="80" minlength="2" required autocomplete="family-name" placeholder="Ваша фамилия" value="${esc(local?.surname||'')}">
          <div class="row"><button type="button" id="cancelBooking">Отмена</button><button type="submit" class="primary" id="confirmBooking">Подтвердить запись</button></div>
        </form>`;
      }else{
        state.selectedSlot=null;
      }
    }
    root.innerHTML=`<section class="detail-view">
      <div class="detail-top">
        <button class="back-btn" data-action="back-home">← Все зачёты</button>
        <div class="detail-heading"><h2>${esc(c.subject)}</h2><div class="date">${esc(dateText(c.exam_date))}</div></div>
      </div>
      <div class="card">
        <div class="cardhead"><div><h3>Распределение мест</h3><div class="date">Выберите свободное место в нужной пятёрке</div></div><span class="pill ${cls}">${esc(status)}</span></div>
        <div class="progress"><i style="width:${slots.length?occupied/slots.length*100:0}%"></i></div>
        <div class="muted">Занято ${occupied} из ${slots.length} мест · Свободно ${slots.length-occupied}</div>
        ${admin?`<div class="row" style="margin-top:10px">
          <button class="small" data-action="mode" data-id="${c.id}" data-mode="auto">Авто</button>
          <button class="small good" data-action="mode" data-id="${c.id}" data-mode="open">Открыть</button>
          <button class="small danger" data-action="mode" data-id="${c.id}" data-mode="closed">Закрыть</button>
          <button class="small" data-action="edit-credit" data-id="${c.id}">Изменить зачёт</button>
          <button class="small" data-action="add-group" data-id="${c.id}">+ Пятёрка</button>
        </div>`:''}
        <div class="groups">${groups.map(g=>{
          const gs=slots.filter(x=>x.group_id===g.id).sort((a,b)=>a.position-b.position);
          return `<div class="group"><div class="grouptitle"><span>Пятёрка ${g.group_number}</span>${admin?`<button class="small danger" data-action="delete-group" data-id="${g.id}">Удалить</button>`:''}</div>
          <div class="slots">${gs.map(x=>{
            const picked=state.selectedSlot?.id===x.id;
            return `<div class="slot ${x.surname?'taken':'free'} ${picked?'selected':''}"><span class="num">Место ${x.position}</span>${x.surname?esc(x.surname):'Свободно'}${admin?`${x.surname?`<button data-action="edit-slot" data-id="${x.id}">Изменить</button><button data-action="select-move" data-id="${x.id}">Источник</button>`:`<button data-action="edit-slot" data-id="${x.id}">Добавить</button>${state.moveFrom?`<button data-action="move-here" data-id="${x.id}">Переместить сюда</button>`:''}`}`:(!x.surname?`<button class="slot-pick" data-action="pick-slot" data-id="${x.id}" data-group="${g.group_number}" aria-label="Выбрать место ${x.position}">Выбрать</button>`:'')}</div>`;
          }).join('')}</div></div>`;
        }).join('')}</div>
        ${booking}
        <p class="detail-note">Нажмите «Выбрать» под свободным местом — форма записи появится ниже.</p>
      </div>
    </section>`;
  }

  async function rpc(name,args={}) {
    const {data,error}=await state.db.rpc(name,args);
    if(error) throw error;
    return data;
  }
  async function act(button,fn) {
    if(state.busy)return; state.busy=true; button.disabled=true;
    try{await fn();await loadData(false);}
    catch(e){message(e.message||String(e),'error');}
    finally{state.busy=false;button.disabled=false;}
  }
  async function submitReservation() {
    const credit=state.selectedCreditId;
    const chosen=state.selectedSlot;
    const input=$('bookingSurname');
    if(!credit||!chosen||!input)return;
    const clean=input.value.trim();
    if(clean.length<2||clean.length>80){message('Фамилия должна содержать от 2 до 80 символов.','error');input.focus();return;}
    const previous=getLocal(credit);
    const token=previous?.token||newToken();
    const submit=$('confirmBooking');
    if(state.busy)return;
    state.busy=true;submit.disabled=true;
    try{
      await rpc('reserve_exam_slot',{p_credit_id:credit,p_group_number:chosen.groupNumber,p_position:chosen.position,p_surname:clean,p_token:token});
      saveLocal(credit,{token,surname:clean});
      state.selectedSlot=null;
      await loadData(false);
      message('Готово! Вы записаны. Ключ для самостоятельного переноса сохранён на этом устройстве.','success');
    }catch(e){message(e.message||String(e),'error');}
    finally{state.busy=false;if($('confirmBooking'))$('confirmBooking').disabled=false;}
  }
  async function adminLogin() {
    const email=$('email').value.trim(),password=$('password').value;
    if(!email||!password){message('Введите почту и пароль.','error');return;}
    $('loginBtn').disabled=true;
    try{
      const {data,error}=await state.db.auth.signInWithPassword({email,password});
      if(error)throw error;
      state.user=data.user;
      const ok=await rpc('is_exam_admin');
      if(!ok){await state.db.auth.signOut();state.user=null;throw new Error('Эта учётная запись не назначена администратором в exam_admins.');}
      state.isAdmin=true; $('loginBox').classList.add('hidden'); $('adminTools').classList.remove('hidden');
      $('adminIdentity').textContent='Вход выполнен: '+(state.user.email||'администратор');
      render();message('Вход администратора выполнен.','success');
    }catch(e){message('Не удалось войти: '+e.message,'error');}
    finally{$('loginBtn').disabled=false;}
  }
  async function checkSession(){
    const {data}=await state.db.auth.getSession();
    if(!data.session)return;
    state.user=data.session.user;
    try{state.isAdmin=!!(await rpc('is_exam_admin'));}catch{state.isAdmin=false;}
    if(state.isAdmin){
      $('loginBox').classList.add('hidden');$('adminTools').classList.remove('hidden');
      $('adminIdentity').textContent='Вход выполнен: '+(state.user.email||'администратор');
    }else{await state.db.auth.signOut();state.user=null;}
    render();
  }
  $('refreshBtn').addEventListener('click',()=>loadData());
  $('adminToggle').addEventListener('click',()=>$('adminPanel').classList.toggle('hidden'));
  $('loginBtn').addEventListener('click',adminLogin);
  $('password').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
  $('logoutBtn').addEventListener('click',async()=>{await state.db.auth.signOut();state.isAdmin=false;state.user=null;state.moveFrom=null;$('loginBox').classList.remove('hidden');$('adminTools').classList.add('hidden');render();message('Вы вышли из панели администратора.');});
  $('historyBtn').addEventListener('click',async()=>{
    const box=$('historyBox');box.classList.toggle('hidden');if(box.classList.contains('hidden'))return;
    try{
      const {data,error}=await state.db.from('exam_history').select('action,surname,details,actor,created_at').order('created_at',{ascending:false}).limit(50);
      if(error)throw error;
      box.innerHTML='<b>Последние действия</b><br>'+((data||[]).map(x=>`${esc(dateText(x.created_at))} — ${esc(x.action)}${x.surname?' · '+esc(x.surname):''}`).join('<br>')||'История пока пуста.');
    }catch(e){box.textContent='Не удалось загрузить историю: '+e.message;}
  });
  $('credits').addEventListener('submit',e=>{
    if(e.target.id==='bookingForm'){e.preventDefault();submitReservation();}
  });
  $('credits').addEventListener('click',e=>{
    const confirmButton=e.target.closest('#confirmBooking');
    if(confirmButton){
      e.preventDefault();
      submitReservation();
      return;
    }
    if(e.target.id==='cancelBooking'){state.selectedSlot=null;render();return;}
    const b=e.target.closest('button[data-action]');if(!b)return;
    const action=b.dataset.action;
    if(action==='open-credit'){
      state.selectedCreditId=b.dataset.id;state.selectedSlot=null;render();window.scrollTo({top:0,behavior:'smooth'});return;
    }
    if(action==='back-home'){
      state.selectedCreditId=null;state.selectedSlot=null;render();window.scrollTo({top:0,behavior:'smooth'});return;
    }
    if(action==='pick-slot'){
      const slot=state.slots.find(x=>x.id===b.dataset.id);
      if(!slot||slot.surname){message('Это место уже занято. Обновите список.','error');return;}
      state.selectedSlot={id:slot.id,groupNumber:Number(b.dataset.group),position:slot.position};
      render();
      const form=$('bookingForm');
      if(form){form.scrollIntoView({behavior:'smooth',block:'center'});$('bookingSurname')?.focus({preventScroll:true});}
      return;
    }
    if(!state.isAdmin){message('Нужны права администратора.','error');return;}
    act(b,async()=>{
      const id=b.dataset.id;
      if(action==='select-move'){
        const source=state.slots.find(x=>x.id===id);
        if(!source?.surname) throw new Error('Исходное место пустое.');
        state.moveFrom=id;
        render();
        message('Источник выбран. Теперь нажмите «Переместить сюда» у свободного места в этой же пятёрке или другом месте этого зачёта.','success');
        return;
      }else if(action==='move-here'){
        if(!state.moveFrom) throw new Error('Сначала выберите занятое место-источник.');
        await rpc('admin_move_slot',{p_from_slot_id:state.moveFrom,p_to_slot_id:id});
        state.moveFrom=null;
      }else if(action==='mode'){
        await rpc('admin_set_signup_mode',{p_credit_id:id,p_mode:b.dataset.mode});
      }else if(action==='add-group'){
        await rpc('admin_add_group',{p_credit_id:id});
      }else if(action==='delete-group'){
        if(!confirm('Удалить пятёрку вместе со всеми её местами и записями?'))return;
        await rpc('admin_delete_group',{p_group_id:id});
      }else if(action==='edit-slot'){
        const slot=state.slots.find(s=>s.id===id);const surname=prompt('Фамилия. Оставьте пустым, чтобы очистить место:',slot?.surname||'');
        if(surname===null)return;
        await rpc('admin_set_slot',{p_slot_id:id,p_surname:surname});
      }else if(action==='edit-credit'){
        const c=state.credits.find(x=>x.id===id);
        const subject=prompt('Название зачёта:',c.subject);if(subject===null)return;
        const date=prompt('Дата и время по Минску (например, 2026-12-09T14:20:00+03:00):',c.exam_date);if(date===null)return;
        const parsed=new Date(date);if(Number.isNaN(parsed.getTime()))throw new Error('Неверная дата.');
        await rpc('admin_update_credit',{p_credit_id:id,p_subject:subject,p_exam_date:parsed.toISOString()});
      }
      message('Изменения сохранены.','success');
    });
  });
  async function start(){
    try{
      if(!window.supabase?.createClient)throw new Error('Не загрузилась библиотека Supabase. Проверьте интернет и обновите страницу.');
      state.db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      await checkSession();
      await loadData();
      setInterval(()=>loadData(false),20000);
    }catch(e){message('Ошибка запуска: '+e.message,'error');}
  }
  start();
})();
</script>
</body>
</html>
